<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  MSDS Engine 交付镜像内的确定性字体映射。

  背景（实测结论）：
  容器内若用度量不同的替代字体渲染中文，换行点会改变、分页随之漂移
  （同一份 PU-303C 金标样本：替代字体 12 页 vs 原字体 7 页）。
  因此镜像自带文档实际使用的中文字体（docker/fonts/），本文件只做三件事：
    1. 把同一字体的各种写法（中文名 / 英文名 / _GB2312 后缀）归一到已装字体；
    2. 把西文字体名映射到度量兼容的 Liberation；
    3. 为未声明的字体名提供中文兜底，避免回落到不含中文字形的字体。

  字体名清单来自对金标样本与模板的实际扫描：
    Arial 678 · Times New Roman 493 · 宋体 304 · 楷体_GB2312 41 · 黑体 6
-->
<fontconfig>
  <match target="pattern"><test name="family"><string>宋体</string></test>
    <edit name="family" mode="assign" binding="strong"><string>SimSun</string></edit></match>
  <match target="pattern"><test name="family"><string>新宋体</string></test>
    <edit name="family" mode="assign" binding="strong"><string>NSimSun</string></edit></match>
  <match target="pattern"><test name="family"><string>黑体</string></test>
    <edit name="family" mode="assign" binding="strong"><string>SimHei</string></edit></match>
  <match target="pattern"><test name="family"><string>楷体_GB2312</string></test>
    <edit name="family" mode="assign" binding="strong"><string>KaiTi</string></edit></match>
  <match target="pattern"><test name="family"><string>楷体</string></test>
    <edit name="family" mode="assign" binding="strong"><string>KaiTi</string></edit></match>
  <match target="pattern"><test name="family"><string>KaiTi_GB2312</string></test>
    <edit name="family" mode="assign" binding="strong"><string>KaiTi</string></edit></match>
  <match target="pattern"><test name="family"><string>仿宋_GB2312</string></test>
    <edit name="family" mode="assign" binding="strong"><string>FangSong</string></edit></match>
  <match target="pattern"><test name="family"><string>仿宋</string></test>
    <edit name="family" mode="assign" binding="strong"><string>FangSong</string></edit></match>
  <match target="pattern"><test name="family"><string>微软雅黑</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Microsoft YaHei</string></edit></match>
  <match target="pattern"><test name="family"><string>Times New Roman</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Liberation Serif</string></edit></match>
  <match target="pattern"><test name="family"><string>Cambria</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Liberation Serif</string></edit></match>
  <match target="pattern"><test name="family"><string>Arial</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Liberation Sans</string></edit></match>
  <match target="pattern"><test name="family"><string>Helvetica</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Liberation Sans</string></edit></match>
  <match target="pattern"><test name="family"><string>Calibri</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Liberation Sans</string></edit></match>
  <match target="pattern"><test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="weak"><string>SimHei</string></edit></match>
  <match target="pattern"><test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="weak"><string>SimSun</string></edit></match>
</fontconfig>